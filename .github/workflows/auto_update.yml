name: Tự động cập nhật Deal và Voucher Shopee mỗi sáng

on:
  schedule:
    # 23:00 giờ quốc tế UTC tương đương với 06:00 giờ sáng Việt Nam (UTC +7)
    - cron: '0 23 * * *'
  workflow_dispatch: # Cho phép bấm nút kích hoạt chạy thủ công trên GitHub bất kỳ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Kéo toàn bộ code từ kho GitHub về máy ảo
    - name: Checkout repository
      uses: actions/checkout@v3

    # Bước 2: Khởi tạo môi trường Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # Bước 3: Cài đặt thư viện (Đã fix thêm pandas)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    # Bước 4: Chạy file Python tạo link 30.000 sản phẩm
    #- name: Chạy script cào Sản Phẩm Shopee
     # run: python filter_datafeed.py

    # Bước 5: Chạy file Python hốt Voucher giảm giá
    - name: Chạy script cào Voucher Shopee
      run: python get_vouchers.py

    # Bước 6: Tự động thu gom dữ liệu mới, lưu lại và đẩy lên GitHub Pages
    - name: Commit và Push dữ liệu mới lên GitHub Pages
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add shopee_products.json shopee_vouchers.json
        # Kiểm tra nếu có dữ liệu mới thay đổi thì tiến hành lưu và đẩy lên
        git diff --quiet && git diff --staged --quiet || (git commit -m "🔥 Tự động cập nhật Deal & Voucher sáng hôm nay" && git push)
