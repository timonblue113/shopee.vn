<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee Siêu Sale - Hệ Thống Soi Deal Timon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --shopee-orange: #ee4d2d; 
            --shopee-bg: #f5f5f5;
        }
        body { 
            background-color: var(--shopee-bg); 
            font-family: -apple-system, Helvetica Neue, Helvetica, Roboto, Arial, sans-serif;
            padding-bottom: 60px;
        }
        
        /* Header Cam Shopee */
        .shopee-header {
            background: linear-gradient(-180deg, #f53d2d, #f63);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .search-box {
            background: #fff;
            border-radius: 4px;
            padding: 4px;
            display: flex;
        }
        .search-box input {
            border: none;
            outline: none;
            padding: 8px 15px;
            flex-grow: 1;
            font-size: 0.95rem;
        }
        .search-box button {
            background-color: var(--shopee-orange);
            color: white;
            border: none;
            padding: 8px 25px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* Khối Voucher Kiểu Shopee */
        .voucher-section {
            background: #fff;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .voucher-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 5px;
        }
        .voucher-card {
            min-width: 260px;
            max-width: 300px;
            background: #fff3f0;
            border: 1px dashed var(--shopee-orange);
            border-left: 8px solid var(--shopee-orange);
            padding: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Thanh Bộ Lọc Danh Mục & Sắp Xếp */
        .filter-bar {
            background-color: rgba(0,0,0,.03);
            padding: 13px 20px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .filter-label { color: #555; font-size: 0.9rem; }
        .filter-btn {
            background: #fff;
            border: 1px solid rgba(0,0,0,.09);
            padding: 6px 15px;
            font-size: 0.9rem;
            border-radius: 2px;
            cursor: pointer;
        }
        .filter-btn.active {
            background-color: var(--shopee-orange);
            color: white;
            border-color: var(--shopee-orange);
        }

        /* Lưới Sản Phẩm Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 992px) { .product-grid { grid-template-columns: repeat(5, 1fr); } }

        /* Thẻ Sản Phẩm */
        .shopee-card {
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            transition: transform 0.1s;
            border: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: unset;
        }
        .shopee-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 1px 20px 0 rgba(0,0,0,0.05);
            border-color: var(--shopee-orange);
        }
        .img-wrapper { position: relative; width: 100%; padding-top: 100%; }
        .img-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .card-body-custom { padding: 8px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title {
            font-size: 0.825rem; line-height: 14px; height: 28px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; margin-bottom: 8px; color: #212121;
        }
        .shopee-price { color: var(--shopee-orange); font-size: 1.05rem; font-weight: 500; }
        .info-row { display: flex; justify-content: space-between; font-size: 0.72rem; color: #757575; margin-top: 4px;}

        /* Tags */
        .tag-yeu-thich {
            position: absolute; top: 4px; left: -4px; background-color: var(--shopee-orange);
            color: white; font-size: 0.65rem; padding: 0 4px; border-radius: 2px; z-index: 10;
        }
        .tag-yeu-thich::after {
            content: ""; position: absolute; left: 0; bottom: -3px;
            border-top: 3px solid #a5220b; border-left: 3px solid transparent;
        }
        .tag-giam-gia {
            position: absolute; top: 0; right: 0; background-color: rgba(255,212,36,0.9);
            color: var(--shopee-orange); font-size: 0.7rem; font-weight: 700; padding: 3px 4px; text-align: center; z-index: 10;
        }
    </style>
</head>
<body>

<div class="shopee-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-12 col-md-4 mb-2 mb-md-0">
                <a href="." class="text-white text-decoration-none d-flex align-items-center justify-content-center justify-content-md-start">
                    <i class="fa-solid fa-bag-shopping fa-2x me-2"></i>
                    <span class="fs-4 fw-bold">Shopee Deal Hot - Timon Tech</span>
                </a>
            </div>
            <div class="col-12 col-md-8">
                <div class="search-box">
                    <input type="text" id="keyword" placeholder="Tìm sản phẩm trong 30.000 deal thực tế...">
                    <button onclick="hanhDongTim()"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container my-3">
    <div class="voucher-section shadow-sm">
        <div class="fw-bold mb-2 text-secondary" style="font-size: 0.9rem;"><i class="fa-solid fa-ticket text-danger me-1"></i> MÃ GIẢM GIÁ ĐỘC QUYỀN HÔM NAY</div>
        <div class="voucher-scroll">
            <div class="text-muted small ps-2 py-2"><i class="fas fa-spinner fa-spin"></i> Đang cập nhật mã giảm giá mới nhất...</div>
        </div>
    </div>

    <div class="filter-bar shadow-sm">
        <span class="filter-label">Sắp xếp theo</span>
        <button class="filter-btn active" id="btn-pop" onclick="doiSort('pho-bien')">Phổ biến</button>
        <button class="filter-btn" id="btn-sold" onclick="doiSort('ban-chay')">Bán chạy</button>
        <button class="filter-btn" id="btn-price" onclick="doiSort('gia-tang')">Giá: Thấp đến Cao</button>
        
        <span class="filter-label ms-md-4">Danh mục nhanh:</span>
        <select class="form-select form-select-sm d-inline-block w-auto" onchange="locDanhMucFast(this.value)">
            <option value="">-- Tất cả sản phẩm --</option>
            <option value="xe">Phụ Kiện Xe</option>
            <option value="ốp">Ốp Lưng & Điện Thoại</option>
            <option value="túi">Túi Xách & Balo</option>
            <option value="sạc">Cáp Sạc & Điện Tử</option>
            <option value="giày">Giày Dép Thời Trang</option>
        </select>
    </div>

    <h5 class="mb-3 text-uppercase text-secondary fw-bold" id="grid-title" style="font-size:1rem; letter-spacing:0.5px;">🔥 GỢI Ý HÔM NAY</h5>

    <div id="status" class="text-center my-5">
        <div class="spinner-border text-danger mb-2"></div>
        <div class="text-muted small">Đang đồng bộ dữ liệu từ Shopee...</div>
    </div>

    <div id="results" class="product-grid"></div>
</div>

<script>
    let fullProductsInventory = []; 
    let currentDisplayedList = []; 
    let filterType = 'pho-bien';

    // Đọc file dữ liệu ngay khi mở trang
    document.addEventListener("DOMContentLoaded", function() {
        const statusBox = document.getElementById('status');

        // 1. LOAD VOUCHER THỰC TẾ TỪ FILE JSON CÀO ĐƯỢC (Đã sửa comment thành chuẩn JS)
        fetch('./shopee_vouchers.json')
            .then(response => {
                if (!response.ok) throw new Error("Chưa có file voucher.");
                return response.json();
            })
            .then(vouchers => {
                let vHtml = '';
                if(!vouchers || vouchers.length === 0) {
                    document.querySelector('.voucher-section').style.display = 'none';
                    return;
                }
                
                vouchers.forEach(v => {
                    vHtml += `
                    <div class="voucher-card shadow-sm">
                        <div style="flex-grow: 1; min-width: 0; padding-right: 8px;">
                            <div class="fw-bold text-danger text-truncate mb-0" style="font-size:0.85rem" title="${v.title}">${v.title}</div>
                            <div class="text-muted text-truncate" style="font-size:0.68rem; line-height: 1.2;" title="${v.desc}">${v.desc}</div>
                            <div class="badge bg-secondary mt-1" style="font-size:0.6rem; letter-spacing:0.5px;">Mã: ${v.code}</div>
                        </div>
                        <a href="${v.link}" target="_blank" class="btn btn-sm btn-danger py-1 fw-bold text-nowrap" style="font-size:0.75rem">LƯU MÃ</a>
                    </div>`;
                });
                document.querySelector('.voucher-scroll').innerHTML = vHtml;
            })
            .catch(err => {
                console.log("Không nạp được file voucher trực tuyến:", err.message);
                document.querySelector('.voucher-section').style.display = 'none';
            });

        // 2. LOAD SẢN PHẨM GỢI Ý NHƯ CŨ (Đã sửa comment thành chuẩn JS)
        fetch('./shopee_products.json')
            .then(response => {
                if (!response.ok) throw new Error("Không tìm thấy tệp JSON.");
                return response.json();
            })
            .then(data => {
                statusBox.classList.add('d-none');
                fullProductsInventory = data;
                
                // Trộn và bốc ngay 30 sản phẩm làm gợi ý ban đầu
                const shuffled = [...fullProductsInventory].sort(() => 0.5 - Math.random());
                currentDisplayedList = shuffled.slice(0, 30);
                
                renderCards(currentDisplayedList);
            })
            .catch(err => {
                statusBox.classList.add('d-none');
                document.getElementById('results').innerHTML = `<div class="alert alert-warning w-100 text-center">Đang nạp dữ liệu Deal, fen hãy kiểm tra lại file shopee_products.json nhé!</div>`;
                console.error(err);
            });
            
        // Bắt sự kiện Enter khi gõ
        document.getElementById('keyword').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') hanhDongTim();
        });
    });

    // Hàm tìm kiếm
    function hanhDongTim() {
        const kw = document.getElementById('keyword').value.trim().toLowerCase();
        const resultsBox = document.getElementById('results');

        if (!kw) {
            alert("Nhập từ khóa tìm kiếm giùm cái fen ơi!");
            return;
        }
        
        document.getElementById('grid-title').innerText = `🔍 KẾT QUẢ TÌM KIẾM CHO: "${kw.toUpperCase()}"`;
        
        const filtered = fullProductsInventory.filter(p => p.name && p.name.toLowerCase().includes(kw));
        
        if (filtered.length === 0) {
            resultsBox.style.display = 'block';
            resultsBox.innerHTML = `
                <div class="alert alert-light border text-center p-5 w-100 shadow-sm">
                    <i class="fa-regular fa-face-frown fa-3x text-muted mb-3"></i>
                    <h5 class="text-secondary">Không tìm thấy sản phẩm phù hợp</h5>
                    <p class="small text-muted mb-0">Thử tìm từ khóa ngắn gọn khác xem sao nhé!</p>
                </div>`;
            return;
        }

        resultsBox.style.display = 'grid';
        currentDisplayedList = filtered;
        xuLySapXepVaRender();
    }

    // Lọc nhanh bằng Thẻ Select
    function locDanhMucFast(val) {
        if(!val) {
            document.getElementById('grid-title').innerText = "🔥 GỢI Ý HÔM NAY";
            document.getElementById('keyword').value = "";
            const shuffled = [...fullProductsInventory].sort(() => 0.5 - Math.random());
            currentDisplayedList = shuffled.slice(0, 30);
            document.getElementById('results').style.display = 'grid';
            renderCards(currentDisplayedList);
            return;
        }
        document.getElementById('keyword').value = val;
        hanhDongTim();
    }

    // Đổi cấu trúc Sắp Xếp
    function doiSort(type) {
        filterType = type;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        if(type === 'pho-bien') document.getElementById('btn-pop').classList.add('active');
        if(type === 'ban-chay') document.getElementById('btn-sold').classList.add('active');
        if(type === 'gia-tang') document.getElementById('btn-price').classList.add('active');
        
        xuLySapXepVaRender();
    }

    // Thực thi sắp xếp mảng
    function xuLySapXepVaRender() {
        let sortedList = [...currentDisplayedList];
        
        if (filterType === 'gia-tang') {
            sortedList.sort((a, b) => Number(a.price_current || 0) - Number(b.price_current || 0));
        } else if (filterType === 'ban-chay') {
            sortedList.sort((a, b) => (b.name || '').length - (a.name || '').length);
        }
        
        renderCards(sortedList.slice(0, 60));
    }

    // Xuất dữ liệu HTML Card
    function renderCards(list) {
        let html = '';
        list.forEach(p => {
            const imageUrl = (p.image && p.image !== 'N/A' && p.image !== 'None') ? p.image : 'https://placehold.co/300x300?text=Shopee';
            
            let displayPrice = 'Liên hệ';
            if (p.price_current && !isNaN(p.price_current) && Number(p.price_current) > 0) {
                displayPrice = Number(p.price_current).toLocaleString('vi-VN') + ' ₫';
            }

            const seed = (p.name || '').length;
            const fakeSold = (seed * 7) % 800 + 115;
            const fakeDiscount = (seed * 3) % 30 + 15;

            html += `
            <a href="${p.link}" target="_blank" class="shopee-card shadow-sm">
                <div class="tag-yeu-thich">Yêu thích</div>
                <div class="tag-giam-gia">-${fakeDiscount}%<br><span style="font-size:0.55rem;font-weight:normal;color:#fff;">GIẢM</span></div>
                <div class="img-wrapper">
                    <img src="${imageUrl}" alt="${p.name}" onerror="this.src='https://placehold.co/300x300?text=Shopee+Mall'">
                </div>
                <div class="card-body-custom">
                    <div class="product-title" title="${p.name}">${p.name}</div>
                    <div class="mt-auto">
                        <div class="shopee-price">${displayPrice}</div>
                        <div class="info-row">
                            <span class="text-warning"><i class="fa-solid fa-star" style="font-size:0.65rem"></i> 4.9</span>
                            <span>Đã bán ${fakeSold}</span>
                        </div>
                    </div>
                </div>
            </a>`;
        });
        document.getElementById('results').innerHTML = html;
    }
</script>
</body>
</html>
