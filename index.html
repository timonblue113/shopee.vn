<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Cày Timon Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --shopee: #ee4d2d; }
        body { background: #f4f4f4; padding-top: 50px; }
        .main-card { max-width: 650px; margin: auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 6px solid var(--shopee); }
        .product-box { border: 1px solid #eee; padding: 15px; border-radius: 10px; margin-top: 15px; text-align: left; display: flex; align-items: center; }
        .price { color: var(--shopee); font-weight: bold; font-size: 1.2rem; }
        .product-img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; margin-right: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card text-center">
        <h2 class="mb-4">🔍 HỆ THỐNG SOI DEAL TIMON</h2>
        <div class="input-group mb-3">
            <input type="text" id="keyword" class="form-control form-control-lg" placeholder="Nhập tên SP (ví dụ: bàn phím, chuột)...">
            <button class="btn btn-danger btn-lg px-4" onclick="batDauTim()">TÌM NGAY</button>
        </div>
        <div id="status" class="d-none text-danger fw-bold my-3">
            <div class="spinner-border spinner-border-sm"></div> Đang lục lọi trong kho Deal sạch...
        </div>
        <div id="results"></div>
    </div>
</div>

<script>
    function batDauTim() {
        const kw = document.getElementById('keyword').value.trim().toLowerCase();
        if (!kw) return;

        const statusBox = document.getElementById('status');
        const resultsBox = document.getElementById('results');

        statusBox.classList.remove('d-none');
        resultsBox.innerHTML = '';

        // Đọc trực tiếp file dữ liệu shopee_products.json do GitHub Actions tự động sinh ra hàng ngày
        fetch('./shopee_products.json')
            .then(response => {
                if (!response.ok) throw new Error("Chưa có file dữ liệu sản phẩm.");
                return response.json();
            })
            .then(products => {
                statusBox.classList.add('d-none');
                
                // Lọc các sản phẩm khớp từ khóa người dùng nhập
                const filtered = products.filter(p => p.name.toLowerCase().includes(kw));

                if (filtered.length === 0) {
                    resultsBox.innerHTML = '<div class="alert alert-warning mt-3">Không tìm thấy sản phẩm nào khớp từ khóa trong kho Deal hôm nay.</div>';
                    return;
                }

                hienThi(filtered);
            })
            .catch(err => {
                statusBox.classList.add('d-none');
                resultsBox.innerHTML = `<div class="alert alert-danger mt-3">Lỗi hệ thống dữ liệu: ${err.message}</div>`;
            });
    }

    function hienThi(products) {
        let html = '';
        products.forEach(p => {
            // Đã bổ sung hiển thị hình ảnh sản phẩm cho chuyên nghiệp
            const imgHtml = (p.image && p.image !== 'N/A') ? `<img src="${p.image}" class="product-img" alt="product">` : '';
            
            html += `<div class="product-box">
                ${imgHtml}
                <div class="flex-grow-1">
                    <div class="fw-bold text-truncate" style="max-width: 380px;">${p.name}</div>
                    <div class="price">₫${Number(p.price_current).toLocaleString('vi-VN')}</div>
                </div>
                <a href="${p.link}" target="_blank" class="btn btn-danger btn-sm px-3">XEM NGAY</a>
            </div>`;
        });
        document.getElementById('results').innerHTML = html;
    }
</script>
</body>
</html>
