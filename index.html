<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Cày Timon Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --shopee: #ee4d2d; }
        body { background: #f4f4f4; padding-top: 50px; }
        .main-card { max-width: 650px; margin: auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 6px solid var(--shopee); }
        .product-box { border: 1px solid #eee; padding: 15px; border-radius: 10px; margin-top: 15px; text-align: left; display: flex; align-items: center; background: #fff; transition: 0.2s; }
        .product-box:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .price { color: var(--shopee); font-weight: bold; font-size: 1.2rem; }
        .product-img { width: 75px; height: 75px; object-fit: cover; border-radius: 8px; margin-right: 15px; background: #f9f9f9; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card text-center">
        <h2 class="mb-4">🔍 HỆ THỐNG SOI DEAL TIMON</h2>
        <div class="input-group mb-3">
            <input type="text" id="keyword" class="form-control form-control-lg" placeholder="Nhập từ khóa (ví dụ: bàn phím, chuột)...">
            <button class="btn btn-danger btn-lg px-4" onclick="batDauTim()">TÌM NGAY</button>
        </div>
        <div id="status" class="d-none text-danger fw-bold my-3">
            <div class="spinner-border spinner-border-sm"></div> Đang lục lọi trong kho Deal sạch...
        </div>
        <div id="results"></div>
    </div>
</div>

<script>
    function batDauTim() {
        const kw = document.getElementById('keyword').value.trim().toLowerCase();
        if (!kw) {
            alert("Vui lòng nhập từ khóa tìm kiếm ba ơi!");
            return;
        }

        const statusBox = document.getElementById('status');
        const resultsBox = document.getElementById('results');

        statusBox.classList.remove('d-none');
        resultsBox.innerHTML = '';

        // Đọc trực tiếp file dữ liệu shopee_products.json nằm cùng thư mục gốc trên GitHub Pages
        fetch('./shopee_products.json')
            .then(response => {
                if (!response.ok) throw new Error("Không tìm thấy file shopee_products.json. Hãy chắc chắn GitHub Actions đã chạy thành công ít nhất 1 lần!");
                return response.json();
            })
            .then(products => {
                statusBox.classList.add('d-none');
                
                // Thuật toán lọc thông minh: tìm các sản phẩm chứa từ khóa người dùng nhập
                const filtered = products.filter(p => p.name.toLowerCase().includes(kw));

                if (filtered.length === 0) {
                    resultsBox.innerHTML = `
                        <div class="alert alert-warning mt-3">
                            Không tìm thấy sản phẩm nào khớp với từ khóa <strong>"${document.getElementById('keyword').value}"</strong> trong kho Deal hiện tại.
                            <br><small class="text-muted">Mẹo: Thử tìm từ ngắn hơn như: bàn phím, chuột, tai nghe...</small>
                        </div>`;
                    return;
                }

                hienThi(filtered);
            })
            .catch(err => {
                statusBox.classList.add('d-none');
                resultsBox.innerHTML = `<div class="alert alert-danger mt-3">Lỗi hệ thống dữ liệu: ${err.message}</div>`;
            });
    }

    function hienThi(products) {
        let html = '';
        products.forEach(p => {
            // Hiển thị ảnh sản phẩm nếu có, nếu rỗng hoặc lỗi thì dùng ảnh mặc định ẩn đi hoặc để trống
            const imgHtml = (p.image && p.image !== 'N/A' && p.image !== 'None') 
                ? `<img src="${p.image}" class="product-img" alt="product" onerror="this.style.display='none'">` 
                : '';
            
            // Format định dạng hiển thị giá tiền Việt Nam cho đẹp mắt
            let displayPrice = p.price_current;
            if (!isNaN(p.price_current)) {
                displayPrice = Number(p.price_current).toLocaleString('vi-VN') + ' ₫';
            }
            
            html += `
            <div class="product-box">
                ${imgHtml}
                <div class="flex-grow-1">
                    <div class="fw-bold text-truncate" style="max-width: 350px;" title="${p.name}">${p.name}</div>
                    <div class="price">${displayPrice}</div>
                </div>
                <a href="${p.link}" target="_blank" class="btn btn-danger btn-sm px-3 fw-bold">XEM NGAY</a>
            </div>`;
        });
        document.getElementById('results').innerHTML = html;
    }
</script>
</body>
</html>
